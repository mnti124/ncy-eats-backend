# Local Postgres for testing without Supabase.
#   docker compose up -d        → Postgres on localhost:5433 (user/pass: postgres/postgres), schema applied
#   docker compose down -v      → stop and wipe the data
# The defaults in application.yml already point here, so `mvn spring-boot:run` just works.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
